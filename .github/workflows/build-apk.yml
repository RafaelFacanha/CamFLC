name: Build CamFLC APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle 8.7 (Sem necessidade de wrapper binario)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Compilar APK de Debug
        run: gradle assembleDebug --stacktrace

      - name: 5. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: CamFLC-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
